# Routes name providers below. Replace models/endpoints without editing pipeline code.
[providers.groq]
base_url = "https://api.groq.com/openai/v1"
api_key_env = "GROQ_API_KEY"
model = "openai/gpt-oss-120b"
structured_output = "json_schema"

[providers.gemini]
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
api_key_env = "GEMINI_API_KEY"
model = "gemini-3.8-flash"
structured_output = "json_schema"

[routes]
episode_analysis = ["groq", "gemini"]
series_analysis = ["gemini", "groq"]
candidate_discovery = ["groq", "gemini"]
blind_evaluation = ["gemini", "groq"]
spoiler_analysis = ["gemini", "groq"]

[llm]
temperature = 0.2
max_tokens = 8192
timeout_seconds = 120
attempts_per_provider = 2

[pipeline]
series_id = "series_001"
max_candidates_per_episode = 12
top_k_episode = 5
top_k_series = 10
cross_episode = false
max_cross_candidates = 8

